## 第六部分：安装信息
# install:
#   - dest: include/                       # 安装的目的路径 dest是相对路径，通常是相对于YoC SDK 安装目录
#     source:                              # 安装源列表
#      - src/*.h                           # 支持通配符，相对路径
install:
  - dest: "bl606p_phyrf/"
    source:
      - "bl606p_phyrf/*"
  - dest: "bl606p_phyrf/reg/bl808/wlan/"
    source:
      - "bl606p_phyrf/reg/bl808/wlan/*"
  - dest: "bl606p_phyrf/reg/bl606p/"
    source:
      - "bl606p_phyrf/reg/bl606p/*"
  - dest: "bl606p_phyrf/arch/"
    source:
      - "bl606p_phyrf/arch/*"
  - dest: "bl606p_phyrf/phy"
    source:
      - "bl606p_phyrf/phy*"
  - dest: "bl606p_phyrf/rfc/"
    source:
      - "bl606p_phyrf/rfc/*"
  - dest: "bl606p_phyrf/fpga/"
    source:
      - "bl606p_phyrf/fpga/*"
  - dest: "bl606p_phyrf/reg/bl808/rf/"
    source:
      - "bl606p_phyrf/reg/bl808/rf/*"
  - dest: "bl606p_phyrf/reg/bl606p/rf/"
    source:
      - "bl606p_phyrf/reg/bl606p/rf/*"
  - dest: "bl606p_phyrf/reg/bl606p/rf2/"
    source:
      - "bl606p_phyrf/reg/bl606p/rf2/*"
  - dest: "bl606p_phyrf/rf/private/"
    source:
      - "bl606p_phyrf/rf/private/*"
  - dest: "bl606p_phyrf/reg/bl808/phy/"
    source:
      - "bl606p_phyrf/reg/bl808/phy/*"
  - dest: "bl606p_phyrf/reg/bl606p/phy/"
    source:
      - "bl606p_phyrf/reg/bl606p/phy/*"
  - dest: "bl606p_phyrf/rf/inc/"
    source:
      - "bl606p_phyrf/rf/inc/*"
  - dest: "bl606p_phyrf/phy/"
    source:
      - "bl606p_phyrf/phy/*"
  - dest: "bl606p_phyrf/reg/bl808/m154/"
    source:
      - "bl606p_phyrf/reg/bl808/m154/*"
  - dest: "bl606p_phyrf/reg/bl606p/m154/"
    source:
      - "bl606p_phyrf/reg/bl606p/m154/*"
  - dest: "bl606p_phyrf/reg/bl808/"
    source:
      - "bl606p_phyrf/reg/bl808/*"

